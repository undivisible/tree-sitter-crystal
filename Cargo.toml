[package]
name = "tree-sitter-crystal"
version = "0.1.0"
description = "Crystal grammar for tree-sitter"
repository = "https://github.com/undivisible/tree-sitter-crystal"
license = "MIT"
edition = "2021"
build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "src/**", "queries/*", "test/corpus/*", "tree-sitter.json", "README.md"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[dev-dependencies]
tree-sitter = "0.26"

[build-dependencies]
cc = "1.0"
